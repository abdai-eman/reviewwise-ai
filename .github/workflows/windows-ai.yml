name: Native Windows AI verification

on:
  push:
    branches: [m3-mvp]
    paths:
      - .github/workflows/windows-ai.yml
      - scripts/verify_windows_ai.py
      - scripts/build_windows.py
      - scripts/manage.py
      - START_REVIEWWISE.bat
      - app.py
      - reviewwise/**
      - assets/**
      - .streamlit/config.toml
      - tests/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviewwise-windows-ai
  cancel-in-progress: true

jobs:
  real-windows-check:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Initialize verification status
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/verification | Out-Null
          @{passed=$false; state='started'; source_commit=$env:GITHUB_SHA; workflow_run=$env:GITHUB_RUN_ID} | ConvertTo-Json | Set-Content docs/verification/windows-ai.json -Encoding utf8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install verified dependencies
        id: dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --only-binary=:all: --require-hashes -r requirements.txt 2>&1 | Tee-Object "$env:RUNNER_TEMP/dependencies.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash requirements.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD '.venv/.reviewwise-requirements.sha256'), $digest, [Text.UTF8Encoding]::new($false))
      - name: Offline tests on native Windows
        id: tests
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v 2>&1 | Tee-Object "$env:RUNNER_TEMP/tests.txt"
          exit $LASTEXITCODE
      - name: Install checksum-verified portable Ollama
        id: runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ollama-windows-amd64.zip'
          Invoke-WebRequest 'https://github.com/ollama/ollama/releases/download/v0.40.14/ollama-windows-amd64.zip' -OutFile $archive
          $expected = '65d68cade6cf6375f398b518224f8c8a15e062387f38cf477abfc848de7e7e29'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Ollama archive checksum mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'reviewwise-ollama'
          Expand-Archive $archive $tools
          $binary = Get-ChildItem $tools -Filter ollama.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Verified archive contains no ollama.exe' }
          $binary.Directory.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "OLLAMA_MODELS=$env:RUNNER_TEMP/reviewwise-models" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Real extraction and repeat-report check
        id: ai
        shell: pwsh
        env:
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MAX_LOADED_MODELS: '1'
          OLLAMA_NO_CLOUD: '1'
        run: |
          $ready = $false
          try { Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2; $ready=$true } catch {}
          if (-not $ready) {
            Start-Process ollama -ArgumentList 'serve' -RedirectStandardOutput "$env:RUNNER_TEMP/ai-server.log" -RedirectStandardError "$env:RUNNER_TEMP/ai-server-error.log"
            for ($i=0; $i -lt 30; $i++) {
              try { Invoke-RestMethod 'http://127.0.0.1:11434/api/version' -TimeoutSec 2; $ready=$true; break } catch { Start-Sleep -Seconds 1 }
            }
          }
          if (-not $ready) { throw 'The model server is unavailable in the inference step' }
          ollama pull qwen2.5:3b 2>&1 | Tee-Object "$env:RUNNER_TEMP/model.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe scripts/verify_windows_ai.py 2>&1 | Tee-Object "$env:RUNNER_TEMP/ai.txt"
          exit $LASTEXITCODE
      - name: Build and exercise the ready-to-run Windows package
        id: package
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts/build_windows.py 2>&1 | Tee-Object "$env:RUNNER_TEMP/package.txt"
          exit $LASTEXITCODE
      - name: Retain the Windows classroom package
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReviewWise-M3-Windows
          path: download/ReviewWise-M3-Windows.zip
          compression-level: 0
      - name: Preserve verification evidence on the feature branch
        if: always()
        shell: pwsh
        env:
          EXPECTED_BRANCH: m3-mvp
        run: |
          if (Test-Path docs/verification/windows-ai.json) {
            $evidence = Get-Content docs/verification/windows-ai.json -Raw | ConvertFrom-Json -AsHashtable
            $evidence['ci_job_status'] = '${{ job.status }}'
            $evidence['stages'] = @{dependencies='${{ steps.dependencies.outcome }}'; tests='${{ steps.tests.outcome }}'; runtime='${{ steps.runtime.outcome }}'; ai='${{ steps.ai.outcome }}'; package='${{ steps.package.outcome }}'}
            $diagnostics = @{}
            foreach ($name in @('dependencies','tests','ai','model','package')) {
              $log = Join-Path $env:RUNNER_TEMP "$name.txt"
              if (Test-Path $log) { $diagnostics[$name] = (Get-Content $log -Tail 30) -join "`n" }
            }
            $evidence['diagnostics'] = $diagnostics
            $evidence | ConvertTo-Json -Depth 50 | Set-Content docs/verification/windows-ai.json -Encoding utf8
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/verification
            if ('${{ steps.package.outcome }}' -eq 'success') { git add download/ReviewWise-M3-Windows.zip }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 1) {
              git commit -m 'Record native Windows AI verification [skip ci]'
              # Only generated evidence/package files are in this commit.
              # During rebase, "theirs" keeps this run's newer generated output.
              git pull --rebase --strategy-option=theirs origin $env:EXPECTED_BRANCH
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              git push origin "HEAD:refs/heads/$env:EXPECTED_BRANCH"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
