name: Publish the already-verified Windows package

on:
  push:
    branches: [m3-mvp]
    paths: [.github/workflows/recover-windows-package.yml]

permissions:
  contents: write
  actions: read

jobs:
  publish-verified-artifact:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ReviewWise-M3-Windows
          run-id: 42028444818
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/verified-package
      - name: Validate source identity and publish only the tested artifact
        shell: pwsh
        run: |
          $archive = Get-ChildItem "$env:RUNNER_TEMP/verified-package" -Filter ReviewWise-M3-Windows.zip -Recurse | Select-Object -First 1
          if (-not $archive) { throw 'The verified artifact is missing' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive.FullName)
          function Read-ZipText([string]$entryName) {
            $entry = $zip.GetEntry($entryName)
            if (-not $entry) { throw "Missing verified entry: $entryName" }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { return $reader.ReadToEnd() } finally { $reader.Dispose() }
          }
          try {
            $manifest = Read-ZipText 'build-info.json' | ConvertFrom-Json -AsHashtable
            if ($manifest.source_commit -ne '32d6c326c6c24a2cc319e4f00d6674edf2a30c80') { throw 'Unexpected artifact source commit' }
            if (-not $manifest.native_portable_imports -or -not $manifest.native_portable_health_request) { throw 'Native package checks are absent' }
            $evidence = Read-ZipText 'docs/verification/windows-ai.json' | ConvertFrom-Json -AsHashtable
            if (-not $evidence.passed -or -not $evidence.real_ui_report_displayed) { throw 'Real UI/AI evidence is absent' }
            foreach ($name in @('app.py','START_REVIEWWISE.bat','requirements.txt','.streamlit/config.toml','assets/interface.css','scripts/manage.py','reviewwise/config.py','reviewwise/pipeline.py','reviewwise/evidence.py','reviewwise/prompts.py','reviewwise/jobs.py','reviewwise/report.py','reviewwise/storage.py')) {
              $entry = $zip.GetEntry($name)
              if (-not $entry) { throw "Missing application file: $name" }
              $stream = $entry.Open()
              $hash = [Security.Cryptography.SHA256]::Create()
              try { $actual = [Convert]::ToHexString($hash.ComputeHash($stream)) } finally { $stream.Dispose(); $hash.Dispose() }
              if ($actual -ne (Get-FileHash $name -Algorithm SHA256).Hash) { throw "Application source changed since verification: $name" }
            }
            foreach ($name in @('recorded-ai-report.json','recorded-ai-report.txt')) {
              [IO.File]::WriteAllText((Join-Path $PWD "docs/verification/$name"), (Read-ZipText "docs/verification/$name"), [Text.UTF8Encoding]::new($false))
            }
            $evidence['publication'] = @{artifact_run='42028444818'; delivery_run=$env:GITHUB_RUN_ID; note='Recovered the existing verified artifact after publication conflicted with a concurrent evidence commit; no new inference or build was performed by this delivery job.'}
            $evidence | ConvertTo-Json -Depth 50 | Set-Content docs/verification/windows-ai.json -Encoding utf8
          } finally { $zip.Dispose() }
          Copy-Item $archive.FullName download/ReviewWise-M3-Windows.zip -Force
          $manifest['package_bytes'] = (Get-Item download/ReviewWise-M3-Windows.zip).Length
          $manifest['package_sha256'] = (Get-FileHash download/ReviewWise-M3-Windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest | ConvertTo-Json -Depth 20 | Set-Content docs/verification/windows-package.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification download/ReviewWise-M3-Windows.zip
          git commit -m 'Publish the verified ready-to-run Windows package [skip ci]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git pull --rebase --strategy-option=theirs origin m3-mvp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/m3-mvp
          exit $LASTEXITCODE
